name: wasl_app
description: "WASL - Secure & Anonymous E2EE Instant Messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  cryptography: ^2.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  sqflite_common_ffi: ^2.4.3
  # E2EE encryption support for AES-256-CBC
  encrypt: ^5.0.3
  record: ^6.0.0
  audioplayers: ^6.8.1
  path_provider: ^2.0.15
  file_picker: ^12.2.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
